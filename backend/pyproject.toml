[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 외부 API·실제 DB를 쓰는 테스트는 기본 실행에서 뺀다: pytest -m kakao_live / pytest -m mysql_live / pytest -m gemini_live
addopts = "-m 'not kakao_live and not mysql_live and not gemini_live'"
markers = [
    "kakao_live: 실제 카카오모빌리티 API를 호출한다 (KAKAO_REST_API_KEY 필요, 일일 쿼터 사용)",
    "gemini_live: 실제 Gemini API를 호출한다 (GEMINI_API_KEY·GEMINI_MODEL 필요, 쿼터 사용)",
    "mysql_live: 로컬 MySQL 테스트 DB를 쓴다 (DB_HOST, DB_USER, DB_PASSWORD, TEST_DB_NAME 필요. 테스트 DB의 회원 데이터를 지운다)",
]
